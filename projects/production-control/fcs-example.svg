<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Field Communication System reconstructed example</title><desc id="desc">A fictional workflow from Excel QR creation and field or office intake through review, client update decision, and recorded output.</desc>
<style>.bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2}.blue{fill:#104a82}.soft{fill:#eaf3fb}.green{fill:#e7f5ed}.h1{font:700 34px Arial;fill:#172033}.h2{font:700 21px Arial;fill:#104a82}.txt{font:17px Arial;fill:#172033}.small{font:14px Arial;fill:#586477}.white{font:700 19px Arial;fill:#fff}.arrow{stroke:#185fa5;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#185fa5"/></marker></defs>
<rect class="bg" width="1400" height="760"/><text class="h1" x="55" y="62">Field Communication System (FCS)</text><text class="small" x="55" y="92">Sanitized reconstructed example — illustrates the designed workflow, not live production data</text>
<rect class="panel" x="55" y="130" width="265" height="175" rx="16"/><text class="h2" x="80" y="166">Excel QR Generator</text><rect class="soft" x="80" y="187" width="92" height="92"/><path d="M90 197h25v25H90zm43 0h25v25h-25zm-43 43h25v25H90zm48 7h18v18h-18z" fill="#172033"/><text class="small" x="188" y="215">Job-linked code</text><text class="small" x="188" y="242">created inside</text><text class="small" x="188" y="269">the workbook</text>
<path class="arrow" d="M320 218 H375"/><rect class="panel" x="385" y="105" width="300" height="130" rx="16"/><text class="h2" x="410" y="143">Field / QR Intake</text><text class="txt" x="410" y="176">Mobile form captures update,</text><text class="txt" x="410" y="202">job phase, and optional photo.</text><rect class="panel" x="385" y="255" width="300" height="130" rx="16"/><text class="h2" x="410" y="293">Office / Admin Intake</text><text class="txt" x="410" y="326">Manual update route for calls,</text><text class="txt" x="410" y="352">email, or office follow-up.</text>
<path class="arrow" d="M685 170 H745 V235 H785"/><path class="arrow" d="M685 320 H745 V255 H785"/><rect class="panel" x="795" y="155" width="255" height="185" rx="16"/><text class="h2" x="820" y="193">Structured Review</text><text class="txt" x="820" y="230">• Job ID and phase</text><text class="txt" x="820" y="261">• Completed work</text><text class="txt" x="820" y="292">• Next action</text><text class="txt" x="820" y="323">• Human validation</text>
<path class="arrow" d="M1050 248 H1110"/><rect class="panel" x="1120" y="155" width="225" height="185" rx="16"/><text class="h2" x="1145" y="193">Decision</text><text class="txt" x="1145" y="232">Client update?</text><rect class="green" x="1145" y="252" width="70" height="40" rx="20"/><text class="txt" x="1163" y="278">Yes</text><rect class="soft" x="1225" y="252" width="70" height="40" rx="20"/><text class="txt" x="1247" y="278">No</text><text class="small" x="1145" y="319">Reviewer remains in control.</text>
<path class="arrow" d="M1230 340 V405 H1025"/><rect class="blue" x="675" y="405" width="670" height="105" rx="16"/><text class="white" x="710" y="447">Recorded Output</text><text class="white" x="710" y="482">Job-linked response • accountable handoff • traceable closure</text>
<rect class="panel" x="55" y="565" width="1290" height="125" rx="16"/><text class="h2" x="80" y="605">Example record: S-204 • Production</text><text class="txt" x="80" y="640">Completed work: protected work area and documented conditions.</text><text class="txt" x="80" y="670">Next we will: review photos, confirm the next step, and send a client update after approval.</text>
</svg>
