<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">PM Action and Alert System reconstructed example</title><desc id="desc">A fictional prioritized project manager queue with daily request cap, due date alerts, and weekly digest routing.</desc>
<style>.bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2}.head{fill:#104a82}.h1{font:700 34px Arial;fill:#172033}.sub{font:18px Arial;fill:#586477}.th{font:700 17px Arial;fill:#fff}.td{font:16px Arial;fill:#172033}.small{font:14px Arial;fill:#586477}.pill{fill:#eaf3fb}.warn{fill:#fff1d8}.ok{fill:#e7f5ed}.line{stroke:#d9e2ec;stroke-width:2}</style>
<rect class="bg" width="1400" height="760"/><text class="h1" x="55" y="62">PM Action &amp; Alert System</text><text class="sub" x="55" y="94">Sanitized reconstructed example — fictional records only</text>
<rect class="panel" x="55" y="125" width="1290" height="92" rx="14"/><text class="td" x="80" y="162">TODAY’S CONTROL</text><text class="h1" x="80" y="198">7 of 10</text><text class="sub" x="210" y="191">update requests assigned to this PM</text><rect class="pill" x="770" y="151" width="250" height="42" rx="21"/><text class="td" x="797" y="178">Priority: WIP first</text><rect class="warn" x="1040" y="151" width="270" height="42" rx="21"/><text class="td" x="1066" y="178">2 due-date emails</text>
<rect class="head" x="55" y="248" width="1290" height="54" rx="10"/><text class="th" x="78" y="282">Priority</text><text class="th" x="188" y="282">Job</text><text class="th" x="315" y="282">Stage</text><text class="th" x="500" y="282">Requested action</text><text class="th" x="875" y="282">Due</text><text class="th" x="1015" y="282">Status</text><text class="th" x="1175" y="282">Route</text>
<g><rect class="panel" x="55" y="302" width="1290" height="73"/><text class="td" x="88" y="346">1</text><text class="td" x="188" y="346">S-104</text><text class="td" x="315" y="346">WIP</text><text class="td" x="500" y="336">Confirm site update and</text><text class="td" x="500" y="358">next production step</text><text class="td" x="875" y="346">Sep 17</text><text class="td" x="1015" y="346">Open</text><text class="td" x="1175" y="346">Email today</text>
<rect class="panel" x="55" y="375" width="1290" height="73"/><text class="td" x="88" y="419">2</text><text class="td" x="188" y="419">S-118</text><text class="td" x="315" y="419">WIP</text><text class="td" x="500" y="409">Add missing target-date</text><text class="td" x="500" y="431">reason and next check</text><text class="td" x="875" y="419">Sep 18</text><text class="td" x="1015" y="419">Sent</text><text class="td" x="1175" y="419">Daily text</text>
<rect class="panel" x="55" y="448" width="1290" height="73"/><text class="td" x="88" y="492">3</text><text class="td" x="188" y="492">S-126</text><text class="td" x="315" y="492">Pre-Production</text><text class="td" x="500" y="482">Confirm authorization and</text><text class="td" x="500" y="504">anticipated start date</text><text class="td" x="875" y="492">Sep 19</text><text class="td" x="1015" y="492">Waiting</text><text class="td" x="1175" y="492">Digest if open</text>
<rect class="panel" x="55" y="521" width="1290" height="73"/><text class="td" x="88" y="565">4</text><text class="td" x="188" y="565">S-131</text><text class="td" x="315" y="565">Pending Sales</text><text class="td" x="500" y="555">Record customer decision</text><text class="td" x="500" y="577">and follow-up date</text><text class="td" x="875" y="565">Sep 22</text><text class="td" x="1015" y="565">Queued</text><text class="td" x="1175" y="565">Daily text</text></g>
<rect class="panel" x="55" y="625" width="620" height="82" rx="12"/><text class="td" x="80" y="659">DAILY LOAD RULE</text><text class="small" x="80" y="688">Maximum 10 update requests per PM per day.</text><rect class="panel" x="700" y="625" width="645" height="82" rx="12"/><text class="td" x="725" y="659">ESCALATION RULE</text><text class="small" x="725" y="688">Email the day before due; unresolved jobs enter Weekly PM Digest.</text>
</svg>
