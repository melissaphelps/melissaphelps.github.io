<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Leadership and Improvement View concept</title><desc id="desc">A concept-only dashboard showing possible projects by stage, stalled work, target reason quality, holds, follow-up, and PDCA measures. It is not an implemented current module.</desc>
<style>.bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2}.h1{font:700 34px Arial;fill:#172033}.h2{font:700 20px Arial;fill:#104a82}.big{font:700 38px Arial;fill:#172033}.txt{font:16px Arial;fill:#586477}.blue{fill:#185fa5}.dark{fill:#104a82}.soft{fill:#eaf3fb}.amber{fill:#f0a54a}.green{fill:#55a979}.line{stroke:#d9e2ec;stroke-width:2}</style>
<rect class="bg" width="1400" height="760"/><text class="h1" x="55" y="62">Leadership &amp; Improvement View — Concept</text><text class="txt" x="55" y="91">Planning mockup only — not a completed current module; all measures shown are fictional</text>
<g><rect class="panel" x="55" y="125" width="240" height="125" rx="14"/><text class="h2" x="80" y="162">Active jobs</text><text class="big" x="80" y="211">186</text><rect class="panel" x="315" y="125" width="240" height="125" rx="14"/><text class="h2" x="340" y="162">Stalled / aging</text><text class="big" x="340" y="211">14</text><rect class="panel" x="575" y="125" width="240" height="125" rx="14"/><text class="h2" x="600" y="162">Missing reason</text><text class="big" x="600" y="211">6</text><rect class="panel" x="835" y="125" width="240" height="125" rx="14"/><text class="h2" x="860" y="162">On hold</text><text class="big" x="860" y="211">9</text><rect class="panel" x="1095" y="125" width="250" height="125" rx="14"/><text class="h2" x="1120" y="162">Follow-up complete</text><text class="big" x="1120" y="211">82%</text></g>
<rect class="panel" x="55" y="280" width="625" height="340" rx="16"/><text class="h2" x="85" y="321">Jobs by stage</text><line class="line" x1="125" y1="560" x2="625" y2="560"/><rect class="dark" x="155" y="380" width="90" height="180"/><rect class="blue" x="285" y="340" width="90" height="220"/><rect class="green" x="415" y="430" width="90" height="130"/><rect class="amber" x="545" y="475" width="90" height="85"/><text class="txt" x="160" y="590">Pending</text><text class="txt" x="288" y="590">Pre-Prod</text><text class="txt" x="438" y="590">WIP</text><text class="txt" x="548" y="590">Closeout</text><text class="txt" x="185" y="370">48</text><text class="txt" x="315" y="330">61</text><text class="txt" x="445" y="420">43</text><text class="txt" x="575" y="465">34</text>
<rect class="panel" x="705" y="280" width="640" height="165" rx="16"/><text class="h2" x="735" y="320">Current exception pattern</text><text class="big" x="735" y="377">6 target records</text><text class="txt" x="735" y="410">show a blank “Reason:” field and require a QA check.</text>
<rect class="panel" x="705" y="465" width="640" height="155" rx="16"/><text class="h2" x="735" y="505">PDCA focus</text><text class="txt" x="735" y="542">PLAN: clarify the structured-note rule.</text><text class="txt" x="735" y="570">DO: prompt for missing reasoning. CHECK: compare weekly exceptions.</text><text class="txt" x="735" y="598">ACT: revise the control only after human review confirms meaning.</text>
<rect class="soft" x="55" y="650" width="1290" height="60" rx="12"/><text class="h2" x="80" y="688">Summary views support decisions; source records remain available for validation and follow-through.</text>
</svg>
